name: PIE P19 Final End-to-End Production Certification

on:
  push:
    branches:
      - pie-p19-final-production-certification
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Protect certified P12-P18 sources
        run: |
          git diff --exit-code 69c42001d69586b1d965af597389cab3f4fb789e --             supabase/functions/pie-infer-state/index.ts             supabase/functions/pie-shadow-read/index.ts             supabase/functions/pie-p14-shadow-read/index.ts             scripts/pie-p12-shadow-certification.mts             scripts/pie-p13-shadow-certification.mts             scripts/pie-p14-read-path-certification.mts             scripts/pie-p15-controlled-production-certification.mts             scripts/pie-p16-production-contract-audit.mts             scripts/pie-p17-failure-isolation-certification.mts             scripts/pie-p18-authoritative-adaptation-certification.mts             src/lib/pie/p13-shadow-client.ts             src/lib/pie/p14-shadow-client.ts             src/components/pie/P13ShadowInferencePanel.tsx             supabase/migrations_v2/0051_pie_p3_candidate_pool.sql
      - run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test -- --passWithNoTests
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: P19 final end-to-end certification
        env:
          V2_URL: ${{ secrets.ZYNTRA_V2_URL }}
          V2_PUBLISHABLE_KEY: ${{ secrets.ZYNTRA_V2_PUBLISHABLE_KEY }}
          PIE_TEST_USER_A_EMAIL: ${{ secrets.PIE_TEST_USER_A_EMAIL }}
          PIE_TEST_USER_B_EMAIL: ${{ secrets.PIE_TEST_USER_B_EMAIL }}
          PIE_TEST_PASSWORD: ${{ secrets.PIE_TEST_PASSWORD }}
        run: npx vite-node scripts/pie-p19-final-production-certification.mts
      - name: P18 regression certification
        env:
          V2_URL: ${{ secrets.ZYNTRA_V2_URL }}
          V2_PUBLISHABLE_KEY: ${{ secrets.ZYNTRA_V2_PUBLISHABLE_KEY }}
          PIE_TEST_USER_A_EMAIL: ${{ secrets.PIE_TEST_USER_A_EMAIL }}
          PIE_TEST_USER_B_EMAIL: ${{ secrets.PIE_TEST_USER_B_EMAIL }}
          PIE_TEST_PASSWORD: ${{ secrets.PIE_TEST_PASSWORD }}
        run: npx vite-node scripts/pie-p18-authoritative-adaptation-certification.mts
      - name: P17 regression certification
        env:
          V2_URL: ${{ secrets.ZYNTRA_V2_URL }}
          V2_PUBLISHABLE_KEY: ${{ secrets.ZYNTRA_V2_PUBLISHABLE_KEY }}
          PIE_TEST_USER_A_EMAIL: ${{ secrets.PIE_TEST_USER_A_EMAIL }}
          PIE_TEST_PASSWORD: ${{ secrets.PIE_TEST_PASSWORD }}
        run: npx vite-node scripts/pie-p17-failure-isolation-certification.mts
      - name: P16 regression certification
        env:
          V2_URL: ${{ secrets.ZYNTRA_V2_URL }}
          V2_PUBLISHABLE_KEY: ${{ secrets.ZYNTRA_V2_PUBLISHABLE_KEY }}
          PIE_TEST_USER_A_EMAIL: ${{ secrets.PIE_TEST_USER_A_EMAIL }}
          PIE_TEST_PASSWORD: ${{ secrets.PIE_TEST_PASSWORD }}
        run: npx vite-node scripts/pie-p16-production-contract-audit.mts
      - name: P15 regression certification
        env:
          V2_URL: ${{ secrets.ZYNTRA_V2_URL }}
          V2_PUBLISHABLE_KEY: ${{ secrets.ZYNTRA_V2_PUBLISHABLE_KEY }}
          PIE_TEST_USER_A_EMAIL: ${{ secrets.PIE_TEST_USER_A_EMAIL }}
          PIE_TEST_USER_B_EMAIL: ${{ secrets.PIE_TEST_USER_B_EMAIL }}
          PIE_TEST_PASSWORD: ${{ secrets.PIE_TEST_PASSWORD }}
        run: npx vite-node scripts/pie-p15-controlled-production-certification.mts
      - name: P14 regression certification
        env:
          V2_URL: ${{ secrets.ZYNTRA_V2_URL }}
          V2_PUBLISHABLE_KEY: ${{ secrets.ZYNTRA_V2_PUBLISHABLE_KEY }}
          PIE_TEST_USER_A_EMAIL: ${{ secrets.PIE_TEST_USER_A_EMAIL }}
          PIE_TEST_USER_B_EMAIL: ${{ secrets.PIE_TEST_USER_B_EMAIL }}
          PIE_TEST_PASSWORD: ${{ secrets.PIE_TEST_PASSWORD }}
        run: npx vite-node scripts/pie-p14-read-path-certification.mts
      - name: P13 regression certification
        env:
          V2_URL: ${{ secrets.ZYNTRA_V2_URL }}
          V2_PUBLISHABLE_KEY: ${{ secrets.ZYNTRA_V2_PUBLISHABLE_KEY }}
          PIE_TEST_USER_A_EMAIL: ${{ secrets.PIE_TEST_USER_A_EMAIL }}
          PIE_TEST_USER_B_EMAIL: ${{ secrets.PIE_TEST_USER_B_EMAIL }}
          PIE_TEST_PASSWORD: ${{ secrets.PIE_TEST_PASSWORD }}
        run: npx vite-node scripts/pie-p13-shadow-certification.mts
      - name: P12 regression certification
        env:
          V2_URL: ${{ secrets.ZYNTRA_V2_URL }}
          V2_PUBLISHABLE_KEY: ${{ secrets.ZYNTRA_V2_PUBLISHABLE_KEY }}
          PIE_TEST_USER_A_EMAIL: ${{ secrets.PIE_TEST_USER_A_EMAIL }}
          PIE_TEST_USER_B_EMAIL: ${{ secrets.PIE_TEST_USER_B_EMAIL }}
          PIE_TEST_PASSWORD: ${{ secrets.PIE_TEST_PASSWORD }}
        run: npx vite-node scripts/pie-p12-shadow-certification.mts
