name: Security Evidence Retention

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Run retention cleanup
        env:
          SUPABASE_URL: ${{ secrets.ZYNTRA_V2_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ZYNTRA_V2_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          curl --fail-with-body -X POST             "$SUPABASE_URL/functions/v1/security-retention-cleanup"             -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"             -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"             -H "Content-Type: application/json"             --data '{}'
