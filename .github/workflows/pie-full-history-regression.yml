name: PIE full-history regression

on:
  pull_request:
    paths:
      - "supabase/migrations_v2/**"
      - "supabase/verification_v2/live_replica/**"
      - ".github/workflows/pie-full-history-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: regression-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: supabase_admin
      PGPASSFILE: /home/runner/.pgpass
      OWNER_ROLE: postgres
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Configure isolated database authentication
        run: |
          printf '%s\n' \
            '127.0.0.1:5432:*:supabase_admin:regression-only-password' \
            '127.0.0.1:5432:*:postgres:regression-owner-password' > "$PGPASSFILE"
          chmod 600 "$PGPASSFILE"
          psql -X -v ON_ERROR_STOP=1 -U supabase_admin -d postgres -c "CREATE ROLE postgres LOGIN NOSUPERUSER CREATEROLE BYPASSRLS INHERIT PASSWORD 'regression-owner-password'"
      - name: Replay live schema and run uncapped-history tests
        working-directory: supabase/verification_v2/live_replica
        run: bash run_0088.sh
      - name: Run Nudge lifecycle against a disposable live-schema replica
        working-directory: supabase/verification_v2/live_replica
        run: bash run_nudge_local.sh
