name: AI Lab V1 Read-only Live Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ai-lab-v1-pie-explainer
    paths:
      - '.github/workflows/ai-lab-v1-live-smoke.yml'
      - 'scripts/ai-lab-v1-live-smoke.mts'
      - 'supabase/functions/v2-ai-lab/**'

permissions:
  contents: read

concurrency:
  group: ai-lab-v1-read-only-live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify deployed AI Lab V1 read-only PIE contract
        env:
          V2_URL: ${{ secrets.ZYNTRA_V2_URL }}
          V2_PUBLISHABLE_KEY: ${{ secrets.ZYNTRA_V2_PUBLISHABLE_KEY }}
          PIE_TEST_USER_A_EMAIL: ${{ secrets.PIE_TEST_USER_A_EMAIL }}
          PIE_TEST_PASSWORD: ${{ secrets.PIE_TEST_PASSWORD }}
        run: npx vite-node scripts/ai-lab-v1-live-smoke.mts
