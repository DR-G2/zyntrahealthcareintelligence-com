name: Zyntra CI

on:
  push:
    branches:
      - main
      - "pie/**"
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      # P8 integration gate: test the complete development intelligence stack before build.
      - run: npm run test
      - run: npm run build
