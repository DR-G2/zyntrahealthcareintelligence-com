name: PIE P12-P16 Linear Production Certification

on:
  push:
    branches:
      - ops/pie-p12-p16-linear-certification-20261019
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pie-p12-p16-linear-production-certification
  cancel-in-progress: false

jobs:
  certify:
    name: Sequential P12-P16 certification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout certification branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test -- --passWithNoTests
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

      - name: P12 live shadow inference certification
        env:
          V2_URL: ${{ secrets.ZYNTRA_V2_URL }}
          V2_PUBLISHABLE_KEY: ${{ secrets.ZYNTRA_V2_PUBLISHABLE_KEY }}
          PIE_TEST_USER_A_EMAIL: ${{ secrets.PIE_TEST_USER_A_EMAIL }}
          PIE_TEST_USER_B_EMAIL: ${{ secrets.PIE_TEST_USER_B_EMAIL }}
          PIE_TEST_PASSWORD: ${{ secrets.PIE_TEST_PASSWORD }}
        run: npx vite-node scripts/pie-p12-shadow-certification.mts

      - name: P13 shadow dashboard certification
        env:
          V2_URL: ${{ secrets.ZYNTRA_V2_URL }}
          V2_PUBLISHABLE_KEY: ${{ secrets.ZYNTRA_V2_PUBLISHABLE_KEY }}
          PIE_TEST_USER_A_EMAIL: ${{ secrets.PIE_TEST_USER_A_EMAIL }}
          PIE_TEST_USER_B_EMAIL: ${{ secrets.PIE_TEST_USER_B_EMAIL }}
          PIE_TEST_PASSWORD: ${{ secrets.PIE_TEST_PASSWORD }}
        run: npx vite-node scripts/pie-p13-shadow-certification.mts

      - name: P14 production read-path certification
        env:
          V2_URL: ${{ secrets.ZYNTRA_V2_URL }}
          V2_PUBLISHABLE_KEY: ${{ secrets.ZYNTRA_V2_PUBLISHABLE_KEY }}
          PIE_TEST_USER_A_EMAIL: ${{ secrets.PIE_TEST_USER_A_EMAIL }}
          PIE_TEST_USER_B_EMAIL: ${{ secrets.PIE_TEST_USER_B_EMAIL }}
          PIE_TEST_PASSWORD: ${{ secrets.PIE_TEST_PASSWORD }}
        run: npx vite-node scripts/pie-p14-read-path-certification.mts

      - name: P15 controlled production exposure certification
        env:
          V2_URL: ${{ secrets.ZYNTRA_V2_URL }}
          V2_PUBLISHABLE_KEY: ${{ secrets.ZYNTRA_V2_PUBLISHABLE_KEY }}
          PIE_TEST_USER_A_EMAIL: ${{ secrets.PIE_TEST_USER_A_EMAIL }}
          PIE_TEST_USER_B_EMAIL: ${{ secrets.PIE_TEST_USER_B_EMAIL }}
          PIE_TEST_PASSWORD: ${{ secrets.PIE_TEST_PASSWORD }}
        run: npx vite-node scripts/pie-p15-controlled-production-certification.mts

      - name: P16 production contract audit
        env:
          V2_URL: ${{ secrets.ZYNTRA_V2_URL }}
          V2_PUBLISHABLE_KEY: ${{ secrets.ZYNTRA_V2_PUBLISHABLE_KEY }}
          PIE_TEST_USER_A_EMAIL: ${{ secrets.PIE_TEST_USER_A_EMAIL }}
          PIE_TEST_PASSWORD: ${{ secrets.PIE_TEST_PASSWORD }}
        run: npx vite-node scripts/pie-p16-production-contract-audit.mts
