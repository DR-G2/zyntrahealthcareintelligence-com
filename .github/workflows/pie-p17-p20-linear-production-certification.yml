name: PIE P17-P20 Linear Production Certification

on:
  workflow_dispatch:
  push:
    branches:
      - ops/pie-p17-p20-linear-certification-20261019

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Protect certified P12-P19 sources from baseline
        run: |
          git diff --exit-code 869c72d9561bca3a1261e42c404acc3c4a99103f -- \
            supabase/functions/pie-infer-state/index.ts \
            supabase/functions/pie-shadow-read/index.ts \
            supabase/functions/pie-p14-shadow-read/index.ts \
            scripts/pie-p12-shadow-certification.mts \
            scripts/pie-p13-shadow-certification.mts \
            scripts/pie-p14-read-path-certification.mts \
            scripts/pie-p15-controlled-production-certification.mts \
            scripts/pie-p16-production-contract-audit.mts \
            scripts/pie-p17-failure-isolation-certification.mts \
            scripts/pie-p18-authoritative-adaptation-certification.mts \
            scripts/pie-p19-final-production-certification.mts \
            src/lib/pie/p13-shadow-client.ts \
            src/lib/pie/p14-shadow-client.ts \
            src/components/pie/P13ShadowInferencePanel.tsx \
            supabase/migrations_v2/0051_pie_p3_candidate_pool.sql
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test -- --passWithNoTests
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Prime P16 projection precondition
        env: &cert_env
          V2_URL: ${{ secrets.ZYNTRA_V2_URL }}
          V2_PUBLISHABLE_KEY: ${{ secrets.ZYNTRA_V2_PUBLISHABLE_KEY }}
          PIE_TEST_USER_A_EMAIL: ${{ secrets.PIE_TEST_USER_A_EMAIL }}
          PIE_TEST_USER_B_EMAIL: ${{ secrets.PIE_TEST_USER_B_EMAIL }}
          PIE_TEST_PASSWORD: ${{ secrets.PIE_TEST_PASSWORD }}
        run: npx vite-node scripts/pie-p16-prime-projection.mts
      - name: P16 regression certification
        env: *cert_env
        run: npx vite-node scripts/pie-p16-production-contract-audit.mts
      - name: P15 regression certification
        env: *cert_env
        run: npx vite-node scripts/pie-p15-controlled-production-certification.mts
      - name: P14 regression certification
        env: *cert_env
        run: npx vite-node scripts/pie-p14-read-path-certification.mts
      - name: P13 regression certification
        env: *cert_env
        run: npx vite-node scripts/pie-p13-shadow-certification.mts
      - name: P12 regression certification
        env: *cert_env
        run: npx vite-node scripts/pie-p12-shadow-certification.mts
      - name: P17 failure isolation
        env: *cert_env
        run: npx vite-node scripts/pie-p17-failure-isolation-certification.mts
      - name: P18 authoritative adaptation boundary
        env: *cert_env
        run: npx vite-node scripts/pie-p18-authoritative-adaptation-certification.mts
      - name: P19 final end-to-end certification
        env: *cert_env
        run: npx vite-node scripts/pie-p19-final-production-certification.mts
      - name: P20 production deployment gate
        env: *cert_env
        run: npx vite-node scripts/pie-p20-production-deployment-gate.mts
