name: PIE P12 Shadow Inference Certification

on:
  workflow_dispatch:
  push:
    branches:
      - pie-p12-inference-canary

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Run P12 live shadow certification
        env:
          V2_URL: ${{ secrets.ZYNTRA_V2_URL }}
          V2_PUBLISHABLE_KEY: ${{ secrets.ZYNTRA_V2_PUBLISHABLE_KEY }}
          PIE_TEST_USER_A_EMAIL: ${{ secrets.PIE_TEST_USER_A_EMAIL }}
          PIE_TEST_USER_B_EMAIL: ${{ secrets.PIE_TEST_USER_B_EMAIL }}
          PIE_TEST_PASSWORD: ${{ secrets.PIE_TEST_PASSWORD }}
        run: npx vite-node scripts/pie-p12-shadow-certification.mts
